<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ph. Rinascere</title>
    <link rel="icon" href="https://res.cloudinary.com/dwqvqpkbe/image/upload/rinascere" type="image/png">
    <meta name="robots" content="noindex">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            text-align: center;
            background: rgba(255,255,255,0.05);
            padding: 60px 40px;
            border-radius: 20px;
            border: 2px solid #d4af37;
        }
        h1 {
            color: #d4af37;
            font-size: 2em;
            margin-bottom: 15px;
        }
        p {
            color: #ccc;
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            padding: 15px 40px;
            background: #d4af37;
            color: #1a1a1a;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1.1em;
        }
        .btn:hover {
            background: #f0c14b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ph. Rinascere</h1>
        <p>
            Los pagos se hacen ahora por transferencia directa.<br>
            Elegí tu álbum y seguí los pasos para recibir el acceso a tus fotos.
        </p>
        <a href="index.html" class="btn">← Ir al inicio</a>
    </div>

</html>
