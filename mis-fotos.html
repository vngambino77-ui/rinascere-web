<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Mis fotografías | Rinascere</title><style>body{background:#171717;color:#f4efe7;font:16px system-ui;margin:0}main{max-width:720px;margin:70px auto;padding:24px}h1{color:#d4af37}.foto{display:flex;align-items:center;justify-content:space-between;padding:15px;border:1px solid #555;margin:12px 0;border-radius:10px}a{color:#151515;background:#d4af37;border-radius:7px;padding:10px 14px;text-decoration:none;font-weight:700}p{line-height:1.5;color:#ccc}</style></head><body><main><h1>Rinascere Fotografías</h1><h2>Tus fotografías originales</h2><p>Descargá únicamente las fotografías incluidas en tu compra. El acceso vence a las 24 horas de su aprobación.</p><div id="fotos"></div><p>Si una descarga falla, contactanos indicando tu número de pedido. Los archivos de gran tamaño requieren un mecanismo de entrega adicional.</p></main><script>const q=new URLSearchParams(location.search),token=q.get('token')||'',n=Number(q.get('cantidad')),area=document.getElementById('fotos');history.replaceState(null,'',location.pathname);if(!/^[a-f0-9]{64}$/.test(token)||!Number.isSafeInteger(n)||n<1||n>500){area.textContent='Enlace inválido';}else{for(let i=0;i<n;i++){const div=document.createElement('div');div.className='foto';const span=document.createElement('span');span.textContent='Fotografía '+String(i+1).padStart(3,'0');const link=document.createElement('a');link.textContent='Descargar';link.href='/.netlify/functions/descargar-foto?token='+encodeURIComponent(token)+'&foto='+i;link.rel='noreferrer';div.append(span,link);area.append(div)}};</script></body></html>
