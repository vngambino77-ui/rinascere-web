name: Validación de seguridad y funciones

on:
  push:
    branches:
      - seguridad-transferencias-integrada
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: npm install --ignore-scripts
      - name: Verificar sintaxis JavaScript
        run: |
          find netlify/functions netlify/lib -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Verificar dependencias
        run: npm ls --depth=0
